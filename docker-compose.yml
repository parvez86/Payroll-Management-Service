# Payroll Management System - Docker Compose
# Configuration uses .env file for environment variables
# Uses .env file created from .env.example

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: payroll-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - payroll-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_user -d payroll_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache (Optional for session management) - COMMENTED OUT
  # redis:
  #   image: redis:7-alpine
  #   container_name: payroll-redis
  #   ports:
  #     - "6380:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - payroll-network
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Payroll Service Backend
  payroll-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # SPRING_REDIS_HOST: redis
      # SPRING_REDIS_PORT: 6379
      # Logging configuration for Docker
      LOGGING_LEVEL_ORG_SP_PAYROLL_SERVICE: ${LOGGING_LEVEL_ORG_SP_PAYROLL_SERVICE}
      LOGGING_PATTERN_CONSOLE: ${LOGGING_PATTERN_CONSOLE}
    ports:
      - "${PAYROLL_SERVICE_PORT}:20001"
    depends_on:
      postgres:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
    networks:
      - payroll-network
    restart: unless-stopped
    labels:
      - "description=Payroll Management System Backend API"
      - "swagger-url=http://localhost:20001/pms/v1/api/swagger-ui/index.html"
      - "health-check=http://localhost:20001/pms/v1/api/actuator/health"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20001/pms/v1/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # pgAdmin for Database Management (Development Only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: payroll-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - payroll-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local

networks:
  payroll-network:
    driver: bridge