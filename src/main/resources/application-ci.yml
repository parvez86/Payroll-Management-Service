spring:
  # CI/CD Environment Configuration
  # Used by both Jenkins and GitHub Actions
  
  # Application Metadata
  application:
    name: Payroll Management Service

  # Database Configuration (Via environment variables)
  datasource:
    # Injected from environment: jdbc:postgresql://postgres:5432/payroll_db
    # SPRING_DATASOURCE_URL: (set in CI environment)
    # SPRING_DATASOURCE_USERNAME: (set in CI environment)
    # SPRING_DATASOURCE_PASSWORD: (set in CI environment)
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PayrollCIHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 900000
  
  # JPA Configuration - CI optimized
  jpa:
    hibernate:
      ddl-auto: validate # ✅ CORRECT: Let Liquibase handle schema creation
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
    drop-first: false

# Logging Configuration for CI
logging:
  level:
    root: WARN
    org.sp.payroll_service: INFO
    org.springframework: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    liquibase: INFO

# Application Configuration
app:
  # CORS Configuration for Frontend Integration
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:4173
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  
  jwt:
    header-prefix: "Bearer "
    secret: ${JWT_SECRET:CISecretKeyForPayrollSystemTesting2024}
    expiration: 86400000 # 24 hours in milliseconds (access token)
    refresh-expiration: 604800000 # 7 days in milliseconds (refresh token)
    issuer: PayrollManagementSystem
  
  payroll:
    grade6-base-salary: 50000.00 # Grade 6 base salary in BDT
    hra-percentage: 0.20 # 20% of basic
    medical-percentage: 0.15 # 15% of basic
    grade-increment: 5000.00 # Increment per grade level

# Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
